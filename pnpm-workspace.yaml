packages:
  - "apps/*"
  - "!apps/mobile"
  - "packages/*"
allowBuilds:
  esbuild: true
  msgpackr-extract: true
overrides:
  postcss: ">=8.5.23"
  body-parser: ">=2.4.0"
  esbuild: ">=0.25.0"
# Supply-chain hardening
minimumReleaseAge: 1440
trustPolicy: no-downgrade
blockExoticSubdeps: true
# undici-types 6.21.0 (via @types/node 22) trips the downgrade heuristic; reviewed, legitimate Node types.
trustPolicyExclude:
  - undici-types@6.21.0

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: voiceai
          POSTGRES_PASSWORD: voiceai
          POSTGRES_DB: voiceai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voiceai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: voiceai
      PGPASSWORD: voiceai
      PGDATABASE: voiceai
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Apply migrations to an empty DB and create the app role
        run: packages/db/scripts/ci-setup-db.sh
      - name: Unit and integration tests
        env:
          TEST_DATABASE_URL: postgres://voiceai:voiceai@localhost:5432/voiceai
          TEST_APP_DATABASE_URL: postgres://voiceai_app:app@localhost:5432/voiceai
        run: pnpm test
      - name: Build web
        env:
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef
        run: pnpm --filter @voiceai/web build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level high
      - name: Semgrep
        run: pipx run semgrep scan --config p/typescript --config p/owasp-top-ten --error --metrics off
